name: Build Malinka SD image

on:
  workflow_dispatch:
  push:
    paths:
      - "malinka/**"
      - ".github/workflows/build-malinka.yml"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install \
            | sh -s -- --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/state/nix/profiles/profile/bin" >> "$GITHUB_PATH"
          echo "experimental-features = nix-command flakes" >> "$HOME/.config/nix/nix.conf"
          echo "max-jobs = auto" >> "$HOME/.config/nix/nix.conf"

      - name: Build Raspberry Pi SD image
        run: nix build ./malinka#nixosConfigurations.malinka-sd.config.system.build.sdImage

      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: malinka-sd-image
          path: result/sd-image/*.img.zst
          if-no-files-found: error
          retention-days: 14
