name: Build Malinka SD image

on:
  workflow_dispatch:
  push:
    paths:
      - "malinka/**"
      - ".github/workflows/build-malinka.yml"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install \
            | sh -s -- --daemon
          sudo systemctl start nix-daemon.socket nix-daemon.service || true
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          sudo mkdir -p /etc/nix
          printf 'experimental-features = nix-command flakes\nmax-jobs = auto\n' \
            | sudo tee /etc/nix/nix.conf >/dev/null

      - name: Build Raspberry Pi SD image
        run: nix build ./malinka#nixosConfigurations.malinka-sd.config.system.build.sdImage

      - name: Upload SD image
        uses: actions/upload-artifact@v4
        with:
          name: malinka-sd-image
          path: result/sd-image/*.img.zst
          if-no-files-found: error
          retention-days: 14
