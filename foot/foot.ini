[main]
include=~/.local/state/dotfiles-theme/current/foot.ini
term=xterm-256color
font=Berkeley Mono SemiBold SemiCondensed:size=10
pad=10x10

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
