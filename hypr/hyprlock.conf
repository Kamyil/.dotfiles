$font = Berkeley Mono SemiBold SemiCondensed
$foreground = rgba(220, 215, 186, 1.0)
$muted = rgba(114, 113, 105, 1.0)
$surface = rgba(31, 31, 40, 0.78)
$accent = rgba(126, 156, 216, 1.0)
$error = rgba(195, 64, 67, 1.0)

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/omarchy/current/background
    color = rgba(15, 15, 20, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.04
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 92
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = $muted
    font_size = 18
    font_family = $font
    position = 0, 105
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 17
    font_family = $font
    position = 0, -38
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    position = 0, -105
    halign = center
    valign = center

    inner_color = $surface
    outer_color = $muted
    check_color = $accent
    fail_color = $error
    font_color = $foreground
    font_family = $font
    outline_thickness = 2

    placeholder_text = <span foreground="##727169">Password or fingerprint</span>
    fail_text = <span foreground="##c34043">$FAIL ($ATTEMPTS)</span>
    dots_center = true
    fade_on_empty = false
    rounding = 14
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = "Enter to unlock"
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, -158
    halign = center
    valign = center
}

auth {
    fingerprint {
        enabled = true
        ready_message = Touch the fingerprint sensor
        present_message = Scanning…
        retry_delay = 250
    }
}
