scan_timeout = 30
command_timeout = 100

"$schema" = "https://starship.rs/config-schema.json"

follow_symlinks = false
add_newline = false
format = "$directory$git_branch > "

palette = "kanagawa"

[directory]
style = "pink"
format = "[$path ]($style)"
truncation_length = 1

[git_branch]
symbol = ""
style = "branch_fg"
format = "[$branch]($style)"

[palettes.kanagawa]
# --- background ---
crust = "#16161D"
mantle = "#1F1F28"
base = "#2A2A37"      # git branch bg

surface0 = "#363646"
surface1 = "#414156"
surface2 = "#4C4C66"
overlay0 = "#585873"
overlay1 = "#72727F"
overlay2 = "#8C8C8C"

# --- text ---
text = "#DCD7BA"
subtext0 = "#A3A3A3"
subtext1 = "#C8C3A6"

# --- accents ---
rosewater = "#DCD7BA"
flamingo = "#C34043"
pink = "#a292a3"      # dragonPink; dir fg
mauve = "#8992a7"
red = "#C34043"
maroon = "#E82424"
peach = "#b6927b"
orange = "#b6927b"
yellow = "#c4b28a"
green = "#76946A"
teal = "#6A9589"
sky = "#809ba7"
sapphire = "#809ba7"
blue = "#809ba7"
violet = "#8992a7"
lavender = "#8992a7"
branch_fg = "#DCD7BA"
