# Display-name overrides for the built-in folders (inbox, quick, archive, trash).
# Example: inbox = "Notes"
[folder_labels]

# Kanban column title overrides, keyed by "<groupBy>:<columnId>".
# Example: "status:todo" = "To Do"
[kanban_column_titles]

# Enabled CSS overrides — list the filenames you want active.
# Example: "focus.css" = "on"
[overrides]
"example.css" = "on"

# Visual color tweaks from Settings → Appearance (token slug = color).
# Example: "accent" = "#ff3b30"
[tweaks]
density = "compact"
cornerRadius = "square"

# Text replacements expanded while typing, keyed by trigger.
# Example: "->" = "→"
[text_replacements]
"->" = "→"

# Saved Tasks filters: a name you pick = the filter query it stands for.
# Recall one from the chips above the task list, the command palette,
# or `:filter <name>` in the Tasks view; `:savefilter <name>` adds one.
# Example: "Project alpha" = "@project:alpha"
[saved_filters]
