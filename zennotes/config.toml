# ZenNotes configuration
# Docs: https://github.com/ZenNotes/zennotes
#
# Holds your portable preferences (theme, editor, vim, keymaps, …) so you can
# sync them across machines with git, stow, chezmoi, and friends. Managed by
# ZenNotes but safe to hand-edit — changes apply live, no restart needed.
#
# Every available option is listed below with its current value; the inline
# comment shows the allowed values. Edit a value to customize it — ZenNotes
# keeps this list complete, so a removed option reappears with its default.
# Note: comments you add yourself may be dropped when the app rewrites the file.

config_version = 1

[vim]
enabled = true  # true | false — CodeMirror Vim bindings
insert_escape = ""  # key sequence to leave insert mode, e.g. "jk"; empty disables
yank_to_clipboard = true  # sync the system clipboard with Vim yank/delete/change and p/P paste
block_ime_in_normal_mode = true  # keep the OS input method (a CJK IME) from composing in normal and visual mode, so hjkl stay motions
wrapped_line_motions = "display"  # display | logical — how $, I, A and dependent operators treat soft-wrapped lines
which_key_hints = true  # show the leader-key hint overlay (Vim only)
which_key_hint_mode = "sticky"  # timed | sticky
which_key_hint_timeout_ms = 900  # how long timed hints stay visible (ms)

[search]
backend = "auto"  # auto | builtin | ripgrep | fzf
ripgrep_path = ""  # absolute path to ripgrep; empty = look on $PATH
fzf_path = ""  # absolute path to fzf; empty = look on $PATH

[editor]
live_preview = true  # hide markdown syntax on inactive lines
show_heading_level_labels = false  # show H1 through H6 badges before headings
render_tables = true  # render tables as widgets in live preview; off keeps them as plain text
sync_title_heading_on_rename = true  # renaming a note rewrites its leading '# heading' to match
markdown_snippets = true  # auto-close markdown delimiters while typing
text_replacements_enabled = true  # expand configured text triggers while typing
auto_pairs = true  # auto-insert matching [] () and {} while typing
auto_pair_quotes_in_prose = false  # also auto-insert matching quotes outside Markdown code
hide_builtin_templates = false  # hide the shipped templates from the pickers
tabs_enabled = true  # enable tab-based editing
wrap_tabs = false  # wrap the tab strip instead of scrolling it
font_size = 18  # editor + preview font size (px)
math_font_scale = 100  # math size as a percentage (50-200); scales $…$ and $$…$$ in editor and preview
line_height = 1.35  # line-height multiplier
tab_size = 4  # tab width in columns, from 1 through 8
list_indent_guides = true  # vertical guide lines at each nested list level
scroll_off = 8  # vim scrolloff — lines kept above/below the cursor (0 = off)
time_format = "24h"  # clock format for the @time macro (12h or 24h)
preview_max_width = 800  # max reading width for the preview (px)
editor_max_width = 1040  # max width of the editor column (px)
completed_task_style = "none"  # none | strikethrough | gray | gray-strikethrough — style checked-task text
math_renderer = "katex"  # katex | typst: typesetter for $…$ / $$…$$ math
typst_tag_preambles = false  # true | false — prepend Typst definitions from notes in a `typst` folder, chosen by a note's tags
harper_enabled = false  # true | false: grammar and spelling with Harper, checked on this device
harper_dialect = "american"  # american | british | australian | canadian | indian
loose_math_delimiters = false  # render $$…$$ display math even with text before/after the fences
default_view_mode = "edit"  # edit | split | preview — the mode a note opens in before it has a remembered one
keep_view_mode_across_notes = false  # true = stay in the current Edit / Split / Preview mode when opening another note; false = each note reopens in its own last mode
persist_undo_history = false  # true = keep each note's undo history between launches, like Vim's undofile (stored with the app, never in the vault; holds deleted text; desktop only)
line_number_mode = "relative"  # off | absolute | relative
line_number_position = "text"  # text | edge
word_wrap = true  # wrap long lines vs. scroll horizontally
preview_smooth_scroll = true  # animate half-page scroll in the preview
pdf_embed_in_edit_mode = "compact"  # compact | full
external_application_schemes = []  # application links enabled for opening, e.g. ["zotero", "obsidian", "vscode"]
ignored_keys = []  # keys the app ignores entirely, by DOM key or code, e.g. ["KanaMode"] for the no-op a Kanata/QMK tap-hold layer sends with every keystroke

[appearance]
pdf_export_use_theme = true  # true | false — export PDFs using the current theme instead of a clean light print theme
theme_family = "custom"  # apple | gruvbox | catppuccin | github | solarized | one | nord | tokyo-night | kanagawa | black-metal | custom
theme_mode = "dark"  # light | dark | auto
theme_id = "custom-kanagawa-paper"  # resolved theme id; normally set automatically from family + mode
dark_sidebar = true  # tint the sidebar darker than the canvas
show_window_title_bar = true  # show the main window title bar and window controls
show_sidebar_chevrons = true  # show disclosure arrows in the sidebar
content_align = "center"  # center | left
unified_sidebar = true  # merge the note list into the sidebar tree

[typography]
interface_font = "Berkeley Mono"  # app chrome font; empty = system default
text_font = "ComicMonoNF"  # editor + preview font; empty = system default
mono_font = "Berkeley Mono"  # code / monospace font; empty = system default

[view]
atlas_enabled = true  # the Atlas map view of the vault (sidebar row, command, Space g); on by default
workflows_enabled = false  # opt in to the Workflows view, its sidebar row, command, and leader shortcut (off by default)
workflow_event_triggers = true  # let active workflows with "trigger: on <event>" run on this device when you save, create, move or tag a note (on by default; needs workflows_enabled)
asset_sort_order = "name-asc"  # Assets view sort: name | used | type | size | modified, each -asc or -desc
note_sort_order = "none"  # none | manual | updated-desc | updated-asc | created-desc | created-asc | name-asc | name-desc
group_by_kind = true  # group notes by kind in the list
nested_tags = true  # show /-separated tags as a collapsible tree (sidebar + Tags view)
view_settings_scope = "global"  # apply note/list view settings globally or per vault (global | vault)
auto_reveal = true  # auto-expand the sidebar to the active note
quick_note_date_title = false  # title quick notes by date instead of a timestamp
quick_note_title_prefix = "Quick Note"  # prefix for new quick-note titles; empty = bare timestamp
auto_calendar_panel = true  # auto-show the calendar for daily / weekly notes
keep_panels_across_notes = true  # true = Connections / Outline / Comments / Calendar stay as set while you switch notes; false = each note remembers its own panels (saved with the workspace, so they survive a restart)
calendar_week_start = "monday"  # monday | sunday | locale
calendar_show_week_numbers = true  # show ISO week numbers in the calendar
tasks_view_mode = "list"  # list | calendar | kanban
show_archived_tasks = false  # keep tasks from archived notes in the Tasks views
kanban_group_by = "status"  # status | priority | folder (each note's own folder; see kanban_folder_root) | field:<key>
kanban_folder_root = ""  # folder board: group by the children of this folder, e.g. "Projects" (deeper notes roll up, notes outside it share one column); "" = each note's own folder
kanban_statuses = []  # custom-status Kanban columns, in order — e.g. ["backlog", "in_progress", "review", "done"]
hidden_workflow_presets = []  # built-in workflow recipes hidden from the gallery, by id — e.g. ["reading-log"]

# Keymap overrides. Add or uncomment "<action.id>" = "<binding>" lines.
# Binding syntax: "Mod+P" = Cmd/Ctrl+P, "Shift+Mod+K", "Ctrl+W", "Space",
# or a two-key sequence like "g g". Uncomment a reference line to remap it.
# An empty binding ("") removes the key entirely: nothing triggers that
# action until you give it a key again or delete the line.
[keymaps]
"global.toggleSidebar" = "Mod+E"
"global.toggleZenMode" = "Ctrl+."
"vim.leaderWeeklyNote" = "Meta+W"
"vim.leaderCalendar" = "Meta+C"
"vim.paneSplitRight" = "Ctrl+/"
"vim.paneSplitDown" = "Ctrl+Shift+/"
"vim.tabPrevious" = "[["
"vim.tabNext" = "]]"

